
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paris Tile Memory</title>

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

  <style>
    :root {
      --cyan: #00f0ff;
      --panel: rgba(3, 14, 25, 0.9);
    }

    
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  background: #06111d;
  color: #eafaff;
  font-family: Inter, ui-sans-serif, system-ui, sans-serif;
}

#app-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
}

/* Map and fog share exactly the same boundaries */
#map-panel {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: #000;
}

#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.shade {
  position: absolute;
  inset: 0;
  z-index: 5;
  background: #000;
  opacity: 1;
  transition: opacity 180ms ease;
  pointer-events: none;
}

.shade.is-revealed {
  opacity: 0;
}

.tile-fog {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  overflow: hidden;
}

.fog-tile {
  position: absolute;
  width: 128px;
  height: 128px;
  background: #000;
  border: 1px solid #080808;
}

/* Styling for incorrect tile feedback */
.fog-tile.wrong-tile {
  background-color: #ff3366 !important;
  border-color: #ff0044 !important;
  box-shadow: inset 0 0 15px rgba(255, 0, 70, 0.8);
  animation: tileShake 0.4s ease-in-out;
  z-index: 10;
}

@keyframes tileShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}    

.fog-tile.is-correctly-revealed {
  animation: correctReveal 600ms ease-out forwards;
  pointer-events: none;
}

@keyframes correctReveal {
  0% {
    opacity: 1;
    background: var(--cyan);
    box-shadow: inset 0 0 0 3px var(--cyan),
                0 0 25px var(--cyan);
  }

  35% {
    opacity: 1;
    background: var(--cyan);
    box-shadow: inset 0 0 0 3px var(--cyan),
                0 0 35px var(--cyan);
  }

  100% {
    opacity: 0;
    box-shadow: inset 0 0 0 3px var(--cyan),
                0 0 15px var(--cyan);
  }
}
      
/* Sidebar */
#sidebar {
  position: relative;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 24px;
  min-width: 0;
  padding: 30px 24px 20px;
  overflow-y: auto;
  background: #071522;
  border-left: 1px solid rgba(0, 240, 255, 0.22);
}

.sidebar-header {
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(0, 240, 255, 0.18);
}

.brand {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: .16em;
}

.brand span {
  color: var(--cyan);
}

.highlight-landmark {
  color: #071522;
  background: var(--cyan);
  padding: 3px 7px;
  border-radius: 4px;
  font-weight: 700;
}

.location-label,
.eyebrow {
  color: var(--cyan);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .16em;
}

.location-label {
  margin: 9px 0 0;
}

.status {
  padding: 13px 14px;
  background: var(--panel);
  border: 1px solid rgba(0, 240, 255, 0.25);
  border-radius: 10px;
  color: #c6d7e2;
  font-size: 12px;
  line-height: 1.7;
  letter-spacing: .06em;
}

/* The question card is now normal sidebar content */
.center-ui {
  display: block;
  padding: 0;
  pointer-events: auto;
}

.center-ui.is-hidden {
  display: none;
}

.control-card {
  width: 100%;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  backdrop-filter: none;
  text-align: left;
  pointer-events: auto;
}


      
h1 {
  margin: 0 0 14px;
  font-size: clamp(24px, 2vw, 32px);
  line-height: 1.2;
  letter-spacing: .03em;
  text-transform: uppercase;
}

.subtitle {
  margin: 0 0 22px;
  max-width: 340px;
  color: #b3c7d4;
  font-size: 14px;
  line-height: 1.7;
}

#revealButton {
  width: 100%;
  min-height: 58px;
  border: 1px solid var(--cyan);
  border-radius: 11px;
  background: var(--cyan);
  color: #03111b;
  font: inherit;
  font-weight: 900;
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 0 24px rgba(0, 240, 255, .15);
}

#revealButton:hover {
  box-shadow: 0 0 32px rgba(0, 240, 255, .3);
}

.timer {
  height: 3px;
  margin-top: 20px;
  overflow: hidden;
  background: rgba(255, 255, 255, .1);
  border-radius: 99px;
}

#timerBar {
  width: 0%;
  height: 100%;
  background: var(--cyan);
}

.timer.running #timerBar {
  animation: countdown 3s linear forwards;
}

@keyframes countdown {
  from { width: 100%; }
  to { width: 0%; }
}

.hint {
  margin: 13px 0 0;
  color: #7f9aaa;
  font-size: 11px;
  line-height: 1.6;
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 18px;
  border-top: 1px solid rgba(0, 240, 255, 0.15);
  color: #637d8d;
  font-size: 9px;
  line-height: 1.6;
  letter-spacing: .1em;
}

/* Custom landmark markers */
.landmark-marker {
  width: 44px;
  height: 44px; 
}


.lives-display {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
  font-size: 24px;
  letter-spacing: 3px;
}

.life {
  color: #ff5364;
  text-shadow: 0 0 10px rgba(255, 83, 100, 0.5);
  transition: opacity 0.3s, transform 0.3s;
}

.life.lost {
  color: #435064;
  opacity: 0.5;
  text-shadow: none;
}      

/* Mobile: map above the sidebar controls */
@media (max-width: 700px) {
  body {
    overflow: auto;
  }

  #app-layout {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(260px, 55dvh) minmax(0, 1fr);
    height: auto;
    min-height: 100dvh;
    overflow: visible;
  }

  #map-panel {
    grid-row: 1;
    min-height: 260px;
  }

  #sidebar {
    grid-row: 2;
    gap: 18px;
    padding: 22px 20px;
    overflow: visible;
    border-left: 0;
    border-top: 1px solid rgba(0, 240, 255, 0.22);
  }

  .sidebar-header {
    padding-bottom: 14px;
  }

  .sidebar-footer {
    margin-top: 8px;
  }
}

  </style>
</head>

<body>
  <div id="app-layout">

    <!-- Main map area: fog overlays stay aligned with the map -->
    <main id="map-panel">
      <div id="map" aria-label="Map of Paris"></div>

      <div id="shade" class="shade" aria-hidden="true"></div>

      <div id="tileFog" class="tile-fog" aria-hidden="true"></div>
    </main>

    <!-- All interface elements sit outside the map -->
    <aside id="sidebar">

      <header class="sidebar-header">
        <div class="brand">Flash <span>Map</span></div>
        <p class="location-label">PARIS EDITION</p>
      </header>

      <div id="livesDisplay" class="lives-display" aria-live="polite"></div>   

      <div class="status" id="status">
        MEMORISE THE MAP<br>
        3 SECOND VIEW
      </div>

      <section class="center-ui">
        <div class="control-card" aria-live="polite">

          <div class="eyebrow">GEOGRAPHY CHALLENGE / 01</div>

          <h1 id="heading">Ready to explore?</h1>

          <p class="subtitle" id="subtitle">
            Study the streets and landmarks of Paris.
            You’ll have three seconds to memorise the map.
          </p>

          <button id="revealButton" type="button">
            Reveal the map
          </button>

          <div class="timer" id="timer">
            <div id="timerBar"></div>
          </div>

          <p class="hint" id="hint">
            The map will darken again automatically.
          </p>

        </div>
      </section>

       

      <footer class="sidebar-footer">
        MEMORISE THE STREETS. FIND THE LANDMARKS.
      </footer>

    </aside>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script>

    // Create the Paris map
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [2.342, 48.861],
      zoom: 11.65,
      minZoom: 10.5,
      maxZoom: 16,
      pitch: 0,
      bearing: 0,
      attributionControl: true
    });

    map.addControl(
      new maplibregl.NavigationControl({ showCompass: false }),
      'bottom-right'
    );

    // Page elements
    const shade = document.getElementById('shade');
    const tileFog = document.getElementById('tileFog');
    const centerUI = document.querySelector('.center-ui');
    const button = document.getElementById('revealButton');
    const heading = document.getElementById('heading');
    const subtitle = document.getElementById('subtitle');
    const hint = document.getElementById('hint');
    const status = document.getElementById('status');
    const timer = document.getElementById('timer');
    const timerBar = document.getElementById('timerBar');
    const MAX_LIVES = 3;

let lives = MAX_LIVES;
let gameOver = false;

const livesDisplay = document.getElementById('livesDisplay');  

    // Add or remove landmarks here.
    // Coordinates must be [longitude, latitude].
    const landmarks = {
      1: {
        name: 'Eiffel Tower',
        coordinates: [2.2945, 48.8584],
        image: 'https://mapsmania.github.io/battleship/eiffel.png'
      },
      2: {
        name: 'Notre-Dame Cathedral',
        coordinates: [2.3499, 48.8529],
        image: 'https://mapsmania.github.io/battleship/notre.png'
      },
      3: {
        name: 'Musée du Louvre',
        coordinates: [2.3364, 48.8606],
        image: 'https://mapsmania.github.io/battleship/louvre.png'
      },
      4: {
        name: 'Arc de Triomphe',
        coordinates: [2.2950, 48.8737],
        image: 'https://mapsmania.github.io/battleship/arc.png'
      },
      5: {
        name: 'Sacré-Cœur',
        coordinates: [2.3430, 48.8867],
        image: 'https://mapsmania.github.io/battleship/montmartre.png'
      }  
    };

    // Automatically determine the question order and total
    const landmarkIds = Object.keys(landmarks);
    const totalQuestions = landmarkIds.length;

    // Create custom landmark image markers
    const landmarkMarkers = [];

    function createLandmarkMarker(name, imageUrl, coordinates) {
      const markerElement = document.createElement('img');

      markerElement.className = 'landmark-marker';
      markerElement.src = imageUrl;
      markerElement.alt = name;
      markerElement.title = name;
      markerElement.width = 44;
      markerElement.height = 44;
      markerElement.draggable = false;

      const marker = new maplibregl.Marker({
        element: markerElement,
        anchor: 'bottom'
      })
        .setLngLat(coordinates)
        .addTo(map);

      landmarkMarkers.push(marker);
    }

    // Automatically add a marker for every landmark
    landmarkIds.forEach(id => {
      const landmark = landmarks[id];

      createLandmarkMarker(
        landmark.name,
        landmark.image,
        landmark.coordinates
      );
    });

    // Game settings
    const TILE_SIZE = 128;

    let timeoutId = null;
    let isRevealed = false;
    let questionActive = false;
    let answerSubmitted = false;

    // Current question is a zero-based index into landmarkIds
    let currentQuestion = 0;

    // Get the current landmark
    function getCurrentLandmark() {
      return landmarks[landmarkIds[currentQuestion]];
    }

    // Create the black grid over the map
    function createFogTiles() {
      tileFog.innerHTML = '';

      const width = map.getContainer().clientWidth;
      const height = map.getContainer().clientHeight;

      const cols = Math.ceil(width / TILE_SIZE);
      const rows = Math.ceil(height / TILE_SIZE);

      tileFog.dataset.cols = cols;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const tile = document.createElement('div');

          tile.className = 'fog-tile';
          tile.dataset.row = row;
          tile.dataset.col = col;
          tile.style.left = `${col * TILE_SIZE}px`;
          tile.style.top = `${row * TILE_SIZE}px`;

          tileFog.appendChild(tile);
        }
      }
    }

    // Update the lives display
function updateLivesDisplay() {
  livesDisplay.innerHTML = '';

  for (let i = 0; i < MAX_LIVES; i++) {
    const heart = document.createElement('span');

    heart.className = i < lives ? 'life' : 'life lost';
    heart.textContent = '♥';
    heart.setAttribute(
      'aria-label',
      i < lives ? 'Life remaining' : 'Life lost'
    );

    livesDisplay.appendChild(heart);
  }
}  

   // Reveal the correct tile with an animation
function revealTile(point) {
  const col = Math.floor(point.x / TILE_SIZE);
  const row = Math.floor(point.y / TILE_SIZE);

  const tile = tileFog.querySelector(
    `.fog-tile[data-row="${row}"][data-col="${col}"]`
  );

  if (!tile) {
    console.warn('Could not find fog tile:', { col, row });
    return;
  }

  // Restart the animation if the class was previously applied
  tile.classList.remove('is-correctly-revealed');
  void tile.offsetWidth;

  tile.classList.add('is-correctly-revealed');

  // Remove the tile when its animation completes
  tile.addEventListener('animationend', () => {
    tile.remove();
  }, { once: true });
}
      
    // Find the fog tile containing geographic coordinates
    function getTileForCoordinates(coordinates) {
      const point = map.project(coordinates);

      return {
        col: Math.floor(point.x / TILE_SIZE),
        row: Math.floor(point.y / TILE_SIZE)
      };
    }

    // Display the current question after the map preview
    function showQuestion() {
      shade.classList.add('is-revealed');
      tileFog.style.display = 'block';

      centerUI.classList.remove('is-hidden');
      centerUI.classList.add('question-mode');

      isRevealed = false;
      questionActive = true;
      answerSubmitted = false;

      const landmark = getCurrentLandmark();

      heading.textContent = `Question ${currentQuestion + 1}`;

      subtitle.innerHTML =
  `Click on the map tile containing <span class="highlight-landmark">${landmark.name}</span>.`;

      hint.textContent = 'Select your answer on the map.';
      button.style.display = 'none';

      status.innerHTML =
        `QUESTION ${currentQuestion + 1} OF ${totalQuestions}<br>FIND ${landmark.name.toUpperCase()}`;

      timer.classList.remove('running');
      timerBar.style.animation = 'none';
    }

    // Show the map for three seconds
    button.addEventListener('click', () => {

      // Restart the game if the player has lost
if (gameOver) {
  gameOver = false;
  lives = MAX_LIVES;
  currentQuestion = 0;
  answerSubmitted = false;
  questionActive = false;
  isRevealed = false;

  if (timeoutId) {
    clearTimeout(timeoutId);
    timeoutId = null;
  }

  // Restore all fog tiles
  createFogTiles();

  // Reset the map and interface
  shade.classList.remove('is-revealed');
  tileFog.style.display = 'none';

  centerUI.classList.remove('is-hidden');
  centerUI.classList.remove('question-mode');

  heading.textContent = 'Ready to explore?';

  subtitle.textContent =
    `Study the streets and landmarks of Paris for three seconds. When the map is hidden, find ${totalQuestions} landmarks.`;

  hint.textContent = 'The map will darken again automatically.';

  status.innerHTML =
    `MEMORISE THE MAP<br>3 SECOND VIEW · ${totalQuestions} LANDMARKS`;

  updateLivesDisplay();

  button.style.display = 'block';
  button.disabled = false;
  button.textContent = 'Reveal the map';

  return;
}  
        
      if (isRevealed || questionActive) return;

      if (timeoutId) {
        clearTimeout(timeoutId);
      }

      isRevealed = true;
      questionActive = false;
      answerSubmitted = false;

      // Reveal the map, retaining previously uncovered tiles
      tileFog.style.display = 'none';
      shade.classList.add('is-revealed');
      centerUI.classList.add('is-hidden');

      button.disabled = true;
      button.textContent = 'Memorise it!';

      status.innerHTML = 'MAP REVEALED<br>LOOK QUICKLY';

      // Restart the countdown animation
      timer.classList.remove('running');
      timerBar.style.animation = 'none';
      timerBar.offsetHeight;
      timerBar.style.animation = '';
      timer.classList.add('running');

      timeoutId = setTimeout(showQuestion, 3000);
    });

    // End the game when all lives are lost
function endGame() {
  gameOver = true;
  questionActive = false;
  isRevealed = false;

  if (timeoutId) {
    clearTimeout(timeoutId);
    timeoutId = null;
  }

  timer.classList.remove('running');
  timerBar.style.animation = 'none';

  centerUI.classList.remove('is-hidden');

  heading.textContent = 'Game Over!';

  subtitle.textContent =
    `You've run out of lives. You found ${currentQuestion} of ${totalQuestions} landmarks.`;

  hint.textContent =
    'Try again and see if you can find every landmark.';

  status.innerHTML = 'GAME OVER<br>NO LIVES REMAINING';

  button.style.display = 'block';
  button.disabled = false;
  button.textContent = 'Play again';

  tileFog.style.display = 'block';
  shade.classList.add('is-revealed');
}  

    // Check whether the player clicked the correct fog tile
    map.on('click', event => {
      if (!questionActive || isRevealed || answerSubmitted) {
        return;
      }

      const landmark = getCurrentLandmark();

      // Find the tile containing the correct landmark
      const correctTile = getTileForCoordinates(
        landmark.coordinates
      );

      // Find the tile clicked by the player
      const clickedCol = Math.floor(event.point.x / TILE_SIZE);
      const clickedRow = Math.floor(event.point.y / TILE_SIZE);

      if (
        clickedCol === correctTile.col &&
        clickedRow === correctTile.row
      ) {
        answerSubmitted = true;
        questionActive = false;

        // Reveal the correctly identified tile
        revealTile(event.point);

        centerUI.classList.remove('is-hidden');

        heading.textContent = 'Correct!';

        subtitle.textContent = `You found ${landmark.name}!`;

        timer.classList.remove('running');
        timerBar.style.animation = 'none';

        // Move on if there are more landmarks
        if (currentQuestion < totalQuestions - 1) {
          currentQuestion++;

          const nextLandmark = getCurrentLandmark();

subtitle.innerHTML =
  `You found ${landmark.name}! Study the map again before your next guess. When it disappears, find <span class="highlight-landmark">${nextLandmark.name}</span>.`;

status.innerHTML =
  `CORRECT<br>${currentQuestion} OF ${totalQuestions} FOUND`;

button.style.display = 'block';
button.disabled = false;
button.textContent = 'Reveal the map';

        } else {
          // All landmarks have been found
          const landmarkNames = landmarkIds
            .map(id => landmarks[id].name);

          heading.textContent = 'Paris explored!';

          subtitle.textContent =
            `You found all ${totalQuestions} landmarks: ${landmarkNames.join(', ')}.`;

          hint.textContent = 'Challenge complete. Well played!';

          status.innerHTML =
            `CHALLENGE COMPLETE<br>${totalQuestions} LANDMARKS FOUND`;

          button.style.display = 'none';
        }

      } else {
        // Incorrect tile: provide visual feedback on the clicked tile
        // Deduct one life for an incorrect guess
lives--;
updateLivesDisplay();

// End the game if no lives remain
if (lives <= 0) {
  endGame();
  return;
}
          
        const clickedTile = tileFog.querySelector(
          `.fog-tile[data-row="${clickedRow}"][data-col="${clickedCol}"]`
        );

        if (clickedTile) {
          // Remove class first in case it was previously clicked so animation re-triggers
          clickedTile.classList.remove('wrong-tile');
          void clickedTile.offsetWidth; // Trigger reflow to restart animation
          clickedTile.classList.add('wrong-tile');

          // Remove the red flash class after 500ms
          setTimeout(() => {
            clickedTile.classList.remove('wrong-tile');
          }, 500);
        }

        // Update sidebar text
        heading.textContent = 'Not quite!';

        subtitle.textContent = 
          `That isn't the tile containing ${landmark.name}. Try again.`;

        hint.textContent = 'Click another tile on the map.';
      }
    });

    // Initialise the game once the map has loaded
    
      createFogTiles();

      shade.classList.remove('is-revealed');
      tileFog.style.display = 'none';

      centerUI.classList.remove('is-hidden');
      centerUI.classList.remove('question-mode');

      heading.textContent = 'Ready to explore?';

      subtitle.textContent =
        `Study the streets and landmarks of Paris for three seconds. When the map is hidden, find ${totalQuestions} landmarks, including ${landmarkIds.map(id => landmarks[id].name).join(', ')}.`;

      hint.textContent =
        'The map will darken again automatically.';

      button.style.display = 'block';
      button.disabled = false;
      button.textContent = 'Reveal the map';

      status.innerHTML =
        `MEMORISE THE MAP<br>3 SECOND VIEW · ${totalQuestions} LANDMARKS`;

      currentQuestion = 0;
      questionActive = false;
      isRevealed = false;
      answerSubmitted = false;

      map.on('load', () => {
      lives = MAX_LIVES;
gameOver = false;
updateLivesDisplay();  
    });

    // Resize the map and rebuild the fog grid
    window.addEventListener('resize', () => {
      map.resize();
      createFogTiles();
    });

  </script>

</body>
</html>
